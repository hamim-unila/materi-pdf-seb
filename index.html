<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Materi PDF</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f3f4f6;text-align:center}
.top{padding:18px;background:white;box-shadow:0 1px 4px rgba(0,0,0,.15)}
h2{margin:0 0 12px} button{font-size:16px;padding:10px 18px;cursor:pointer}
#nama{margin-top:10px;color:#555}
#viewer{display:none;width:100%;height:calc(100vh - 120px);border:0;background:white}
</style>
</head>
<body>
<div class="top">
<h2>Pilih Materi PDF</h2>
<button id="pilih">Pilih File PDF</button>
<div id="nama">Belum ada file dipilih.</div>
</div>
<input id="file" type="file" accept=".pdf,application/pdf" hidden>
<iframe id="viewer" title="Pembaca PDF"></iframe>
<script>
const input=document.getElementById("file");
const button=document.getElementById("pilih");
const nama=document.getElementById("nama");
const viewer=document.getElementById("viewer");
let currentURL=null;
button.addEventListener("click",()=>input.click());
input.addEventListener("change",()=>{
 const file=input.files[0]; if(!file)return;
 if(file.type!=="application/pdf"&&!file.name.toLowerCase().endsWith(".pdf")){
   alert("Silakan pilih file PDF."); input.value=""; return;
 }
 if(currentURL)URL.revokeObjectURL(currentURL);
 currentURL=URL.createObjectURL(file);
 nama.textContent="File: "+file.name;
 viewer.src=currentURL; viewer.style.display="block";
});
</script>
</body>
</html>
